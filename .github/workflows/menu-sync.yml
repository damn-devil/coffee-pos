name: Обновление меню с кассы

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: menu-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Забрать меню из общего канала
        env:
          SYNC_TOPIC: coffee_pos_menu_9f4c1e7a2b
        run: python3 .github/sync_menu.py

      - name: Закоммитить изменения
        run: |
          if git diff --quiet -- menu.json; then
            echo "Меню не изменилось"
            exit 0
          fi
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menu.json
          git commit -m "Обновление меню с кассы"
          git push
